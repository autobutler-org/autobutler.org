<?xml version="1.0" encoding="UTF-8"?>
<!--
  AutoButler business card, front. 3.5in x 2in trim + 0.125in bleed.
  viewBox units are 1/100 in: bleed edge 0..375 x 0..225, trim 12.5..362.5 x 12.5..212.5,
  safe zone 25..350 x 25..200. {{NAME}} {{TITLE}} {{EMAIL}} are filled by build.mjs (TITLE is uppercased as an eyebrow).
  Style follows quark.autobutler.org (editorial redesign): bone canvas, ink text, hairlines, Newsreader + Geist Mono.
-->
