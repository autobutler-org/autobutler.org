    <text x="37.5" y="117" font-family="'Geist Mono', 'SF Mono', ui-monospace, monospace" font-size="10" font-weight="400" letter-spacing="0.6" fill="#6a6964">{{TITLE}}</text>
    <text x="37.5" y="141" font-family="'Newsreader 16pt', Newsreader, 'Iowan Old Style', Georgia, serif" font-size="26" font-weight="400" letter-spacing="-0.39" fill="#111111">{{NAME}}</text>
    <text x="37.5" y="162.5" font-family="'Geist Mono', 'SF Mono', ui-monospace, monospace" font-size="10" font-weight="400" fill="#2f3437">{{EMAIL}}</text>
